<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under Maintenance</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fa;
      color: #222;
      text-align: center;
    }

    .container {
      width: 90%;
      max-width: 600px;
      padding: 40px 25px;
    }

    .icon {
      font-size: 80px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    p {
      font-size: 18px;
      color: #666;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .loader {
      width: 45px;
      height: 45px;
      border: 5px solid #ddd;
      border-top: 5px solid #333;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 25px;
    }

    .contact {
      font-size: 15px;
      color: #888;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 32px;
      }

      p {
        font-size: 16px;
      }

      .icon {
        font-size: 65px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="icon">🔧</div>

    <h1>Under Maintenance</h1>

    <div class="loader"></div>

    <p>
      Our website is currently undergoing maintenance.
      We are working hard to improve your experience.
    </p>

    <p class="contact">
      We'll be back soon. Thank you for your patience!
    </p>

  </div>

</body>
</html>
